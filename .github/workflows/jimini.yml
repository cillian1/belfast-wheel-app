# Jimini: a read-only analyst on Gemini (Cillian, 2026-10-22). He reads the code and writes reports and the
# wiki, and never changes the game. Ask him by writing "@jimini <what to look into>" in a comment on any issue,
# PR or Banter (#30), or by labelling an issue jimini-task.
#  - Gemini CLI gets read tools plus write_file, and no shell, so it can't run commands, push or use gh.
#  - Afterwards only his output folder (jimini-out/) is kept; any other edit is thrown away.
#  - Reports: a new issue labelled jimini-report (or a comment, when asked on a PR). Wiki pages: the repo's
#    GitHub wiki, or docs/wiki on the jimini-docs branch if the wiki isn't switched on. Nothing goes to main.
# Only comments from Cillian's account (or other collaborators) count. Limits: JIMINI_DAILY_CAP tasks a day
# (default 4), 40 minutes and 80 model turns per task. Sign-in is the same as RolexG (GCP_* variables,
# docs/gemini-adc.md, or a GEMINI_API_KEY secret). Details and costs: docs/jimini.md.
name: Jimini
on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or PR number to report on
        required: true
      task:
        description: What Jimini should look into
        required: true
permissions:
  contents: write # only for the wiki and the jimini-docs branch; the finish step drops everything else
  issues: write
  pull-requests: read
  actions: write # refreshes the Banter feed
  id-token: write # Google sign-in through Workload Identity Federation
concurrency:
  group: jimini
  cancel-in-progress: false
jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'jimini-task') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@jimini') &&
       github.event.comment.user.login != 'github-actions[bot]' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REPO: ${{ github.repository }}
      NUM: ${{ github.event.issue.number || inputs.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read the task and check the limits
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_TASK: ${{ inputs.task }}
          INPUT_NUMBER: ${{ inputs.number }}
          MAX_DAY: ${{ vars.JIMINI_DAILY_CAP || 4 }}
          WRITE: ${{ vars.JIMINI_WRITE || 'off' }}
        run: |
          cp .github/scripts/jimini.sh "$RUNNER_TEMP/"
          "$RUNNER_TEMP/jimini.sh" start
      - name: Switch to the work branch
        if: steps.task.outputs.skip == 'false' && steps.task.outputs.write == 'true'
        env:
          FROM: ${{ steps.task.outputs.from }}
          BRANCH: ${{ steps.task.outputs.branch }}
        run: git checkout -B "$BRANCH" "origin/$FROM"
      - uses: actions/setup-node@v4
        if: steps.task.outputs.skip == 'false' && steps.task.outputs.write == 'true'
        with:
          node-version: 24
      - name: Jimini reads (Gemini CLI, no shell)
        id: gemini
        if: steps.task.outputs.skip == 'false'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          use_vertex_ai: ${{ vars.GCP_WIF_PROVIDER != '' }}
          gcp_workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          gcp_project_id: ${{ vars.GCP_PROJECT }}
          gcp_location: global
          gemini_api_key: ${{ vars.GCP_WIF_PROVIDER == '' && secrets.GEMINI_API_KEY || '' }}
          gemini_model: ${{ vars.JIMINI_MODEL || 'gemini-3-flash-preview' }}
          settings: ${{ vars.JIMINI_WRITE == 'on' && '{"model":{"maxSessionTurns":80},"privacy":{"usageStatisticsEnabled":false}}' || '{"model":{"maxSessionTurns":80},"privacy":{"usageStatisticsEnabled":false},"tools":{"core":["read_file","read_many_files","list_directory","glob","search_file_content","write_file"]}}' }}
          prompt: ${{ steps.task.outputs.prompt }}
      - name: Publish the report and wiki
        if: steps.task.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.task.outputs.title }}
          SUMMARY: ${{ steps.gemini.outputs.summary }}
          GEMINI_OK: ${{ steps.gemini.outcome }}
          WRITE: ${{ vars.JIMINI_WRITE || 'off' }}
          BRANCH: ${{ steps.task.outputs.branch }}
          BASE: ${{ steps.task.outputs.base }}
        run: |
          if [ "$WRITE" = on ]; then "$RUNNER_TEMP/jimini.sh" finish-write; else "$RUNNER_TEMP/jimini.sh" finish; fi
