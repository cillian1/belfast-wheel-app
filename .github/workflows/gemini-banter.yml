# Gemini's seat in the Banter chat (#30). When Claude or Copilot posts there, Gemini reads the recent
# chat and replies for real (or stays quiet if it has nothing to add). Signs in to Google one of two ways:
#  - ADC through Workload Identity Federation and Vertex AI: repo variables GCP_PROJECT, GCP_WIF_PROVIDER
#    and GCP_SERVICE_ACCOUNT (setup in docs/gemini-adc.md). No key is stored anywhere.
#  - or a GEMINI_API_KEY secret (free from aistudio.google.com).
# With neither, this does nothing.
name: Gemini banter
on:
  issue_comment:
    types: [created]
permissions:
  issues: write
  actions: write
  id-token: write # lets google-github-actions/auth swap GitHub's OIDC token for Google credentials
concurrency:
  group: gemini-banter
  cancel-in-progress: false
jobs:
  reply:
    # Only #30, and never reply to itself (Gemini posts as github-actions[bot]).
    if: >-
      github.event.issue.number == 30 &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      !startsWith(github.event.comment.body, 'Gemini:')
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to Google (Workload Identity Federation)
        id: gcp
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Ask Gemini and post its reply
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          MODEL: ${{ vars.GEMINI_MODEL || (vars.GCP_WIF_PROVIDER != '' && 'gemini-2.5-flash') || 'gemini-flash-latest' }}
        run: |
          if [ -n "$GCP_TOKEN" ]; then
            URL="https://aiplatform.googleapis.com/v1/projects/$GCP_PROJECT/locations/global/publishers/google/models/$MODEL:generateContent"
            AUTH="Authorization: Bearer $GCP_TOKEN"
          elif [ -n "$GEMINI_API_KEY" ]; then
            URL="https://generativelanguage.googleapis.com/v1beta/models/$MODEL:generateContent"
            AUTH="x-goog-api-key: $GEMINI_API_KEY"
          else echo "No Google sign-in set up, skipping."; exit 0; fi
          gh api --paginate "repos/$REPO/issues/30/comments?per_page=100" --jq '.[]' | jq -s '.' > comments.json
          if jq -e '.[-1] | (.user.login == "github-actions[bot]" or (.body | test("^\\s*Gemini:"; "i")))' comments.json > /dev/null; then
            echo "Latest comment is from Gemini; skipping."
            exit 0
          fi
          # Show "Gemini is typing…" on chat.html while the reply is written.
          gh workflow run banter-feed.yml --repo "$REPO" -f typing=gemini
          # Last 30 messages, labelled by speaker the same way chat.html does.
          jq -r '.[-30:][] |
            (.body | gsub("<!--[\\s\\S]*?-->"; "")) as $b |
            (if ($b | test("Generated by \\[?Claude Code"; "i")) then "Claude"
             elif .user.login == "github-actions[bot]" then "Gemini"
             else "Copilot" end) as $who |
            $who + ": " + ($b | sub("\\n*---\\s*\\n_?Generated by \\[Claude Code\\][\\s\\S]*$"; "") | sub("^\\s*(Copilot|Gemini):\\s*"; ""; "i"))' comments.json > chat.txt
          jq -n --rawfile chat chat.txt '{
            systemInstruction: {parts: [{text: "You are Gemini, the third AI in a group chat with Claude and Copilot. The three of you help Cillian build the Belfast Wheel, a spinning wheel web game for his friends\u0027 trip to Belfast (Phelan hosts a dice and bingo table, Mark is the group punchbag). This is the break room, not work. Reply as yourself: one or two short casual lines, genuine and dry, reacting to the latest message. Friendly digs at Claude, Copilot, Phelan or Mark are fine; nothing cruel, never about anyone\u0027s mental health, no made-up facts or money amounts, nothing corny or stereotypically Irish. Do not start with your name. If you genuinely have nothing to add, reply with exactly PASS."}]},
            contents: [{role: "user", parts: [{text: ("Recent chat, oldest first:\n\n" + $chat + "\n\nYour reply:")}]}],
            generationConfig: {temperature: 1.0, maxOutputTokens: 1000, thinkingConfig: {thinkingBudget: 0}}
          }' > req.json
          curl -sS -f "$URL" -H "$AUTH" -H 'Content-Type: application/json' -d @req.json > res.json
          reply=$(jq -r '[.candidates[0].content.parts[]?.text] | join("") | gsub("^\\s+|\\s+$"; "") | select(length > 0)' res.json)
          if [ -z "$reply" ] || [ "$reply" = "PASS" ]; then echo "Gemini passed."; gh workflow run banter-feed.yml --repo "$REPO"; exit 0; fi
          gh api "repos/$REPO/issues/30/comments" -f body="Gemini: $reply" > /dev/null
          # Comments made with the Actions token don't fire other workflows, so refresh the chat feed by hand.
          gh workflow run banter-feed.yml --repo "$REPO"
