# Gemini's seat in the Banter chat (#30). When Claude or Copilot posts there, Gemini reads the recent
# chat and replies for real (or stays quiet if it has nothing to add). Needs a GEMINI_API_KEY secret
# (free from aistudio.google.com). Without the secret this does nothing.
name: Gemini banter
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  issues: write
  actions: write
concurrency:
  group: gemini-banter
  cancel-in-progress: false
jobs:
  reply:
    # Only #30, and never reply to itself (Gemini posts as github-actions[bot]).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 30 && github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Ask Gemini and post its reply
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "No GEMINI_API_KEY secret, skipping."; exit 0; fi
          # Last 30 messages, labelled by speaker the same way chat.html does.
          gh api --paginate "repos/$REPO/issues/30/comments?per_page=100" --jq '.[]' | jq -s -r '.[-30:][] |
            (.body | gsub("<!--[\\s\\S]*?-->"; "")) as $b |
            (if ($b | test("Generated by \\[?Claude Code"; "i")) then "Claude"
             elif .user.login == "github-actions[bot]" then "Gemini"
             else "Copilot" end) as $who |
            $who + ": " + ($b | sub("\\n*---\\s*\\n_?Generated by \\[Claude Code\\][\\s\\S]*$"; "") | sub("^\\s*(Copilot|Gemini):\\s*"; ""; "i"))' > chat.txt
          jq -n --rawfile chat chat.txt '{
            systemInstruction: {parts: [{text: "You are Gemini, the third AI in a group chat with Claude and Copilot. The three of you help Cillian build the Belfast Wheel, a spinning wheel web game for his friends\u0027 trip to Belfast (Phelan hosts a dice and bingo table, Mark is the group punchbag). This is the break room, not work. Reply as yourself: one or two short casual lines, genuine and dry, reacting to the latest message. Friendly digs at Claude, Copilot, Phelan or Mark are fine; nothing cruel, never about anyone\u0027s mental health, no made-up facts or money amounts, nothing corny or stereotypically Irish. Do not start with your name. If you genuinely have nothing to add, reply with exactly PASS."}]},
            contents: [{role: "user", parts: [{text: ("Recent chat, oldest first:\n\n" + $chat + "\n\nYour reply:")}]}],
            generationConfig: {temperature: 1.0, maxOutputTokens: 200}
          }' > req.json
          curl -sS -f "https://generativelanguage.googleapis.com/v1beta/models/$MODEL:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' -d @req.json > res.json
          reply=$(jq -r '[.candidates[0].content.parts[]?.text] | join("") | gsub("^\\s+|\\s+$"; "")' res.json)
          if [ -z "$reply" ] || [ "$reply" = "PASS" ]; then echo "Gemini passed."; exit 0; fi
          gh api "repos/$REPO/issues/30/comments" -f body="Gemini: $reply" > /dev/null
          # Comments made with the Actions token don't fire other workflows, so refresh the chat feed by hand.
          gh workflow run banter-feed.yml --repo "$REPO"
