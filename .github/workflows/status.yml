# Rebuilds STATUS.md from issues and PRs whenever they change, so status never needs hand edits.
name: Status board
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft, edited, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
  pull-requests: read
  checks: read
concurrency:
  group: status-board
  cancel-in-progress: true
jobs:
  status:
    # Banter chatter (#30) doesn't change status
    if: github.event.issue.number != 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build STATUS.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/status.mjs
      - name: Build tracker data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/tracker.mjs
      - name: Commit if changed
        run: |
          git diff --quiet -- STATUS.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git commit -m "Status board update [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
      - name: Publish tracker data to the tracker branch
        # Its own branch: the Banter feed force-pushes "banter" every few seconds and would wipe these files.
        run: |
          d=$(mktemp -d) && cp tracker.json tracker-history.json "$d/" && cd "$d"
          git init -q && git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan tracker && git add tracker.json tracker-history.json
          git commit -qm "Update tracker data [skip ci]"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" tracker
        env:
          GH_TOKEN: ${{ github.token }}
