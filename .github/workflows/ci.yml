name: CI

on:
  pull_request:
  push:
  workflow_dispatch: # RolexG starts CI on its branches (its own pushes don't)

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      # Chromium is cached per Playwright version, so runs only download it when the version changes
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.64.1-${{ runner.os }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: node tools/bundle.mjs
      - run: git diff --exit-code -- game/index.html
      - run: node tools/check.mjs
      - run: node tools/check-game-invariants.mjs origin/main
      - run: git show origin/main:game/index.html > "$RUNNER_TEMP/main-game.html"
      - run: node tools/test-ci-browser.mjs "$RUNNER_TEMP/main-game.html"

  # Gemini may merge (Cillian, 2026-10-22). If Gemini's review already said "Verdict: merge" on this commit,
  # merge now that CI is green (.github/scripts/bot-merge.sh has the rules). Quiet otherwise.
  bot-merge:
    needs: ci
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BOT_MERGE_MAIN: ${{ vars.BOT_MERGE_MAIN }}
        run: .github/scripts/bot-merge.sh "${{ github.event.pull_request.number }}" Gemini
