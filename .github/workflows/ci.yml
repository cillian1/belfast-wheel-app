name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/bundle.mjs
      - run: git diff --exit-code -- game/index.html
      - run: node tools/check.mjs
      - run: node tools/check-game-invariants.mjs origin/main
      - run: git show origin/main:game/index.html > "$RUNNER_TEMP/main-game.html"
      - run: node tools/test-ci-browser.mjs "$RUNNER_TEMP/main-game.html"
