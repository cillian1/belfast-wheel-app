name: CI

on:
  pull_request:
  # PR branches already run on pull_request; pushing them too ran every check twice
  push:
    branches: [main, 'update-*']
  workflow_dispatch: # RolexG starts CI on its branches (its own pushes don't)

permissions:
  contents: read

# A newer push to the same PR cancels the old run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      payback: ${{ steps.quick-check.outputs.payback }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Docs, Banter, bot and workflow-only PRs skip the game checks. bot-merge still sees a green "ci" check.
      - id: scope
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo game=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          echo "$files"
          if echo "$files" | grep -qvE '^(\.github/|docs/|banter/|tools/(gambler|stankman)/|HANDOFF\.md$|STATUS\.md$|README\.md$|[^/]*\.md$)'; then
            echo game=true >> "$GITHUB_OUTPUT"
          elif echo "$files" | grep -qx '.github/workflows/ci.yml'; then
            echo game=true >> "$GITHUB_OUTPUT"
          else
            echo "No game, wallet or tools changes: skipping game checks"
          fi
      - if: steps.scope.outputs.game == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.scope.outputs.game == 'true'
        id: quick-check
        run: |
          output=$(node tools/check.mjs --quick)
          printf '%s\n' "$output"
          payback=$(printf '%s\n' "$output" | grep -E '^payback ' | tail -n 1)
          [ -n "$payback" ] || { echo 'Quick check did not produce a payback line.' >&2; exit 1; }
          echo "payback=$payback" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.game == 'true'
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      # Chromium is cached per Playwright version. apt install-deps (which hung for 6 h on Oct 22) only runs
      # if the runner is actually missing a library the browser needs.
      - if: steps.scope.outputs.game == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.64.1-${{ runner.os }}
      - if: steps.scope.outputs.game == 'true'
        timeout-minutes: 4
        run: |
          [ "${{ steps.pw-cache.outputs.cache-hit }}" = true ] || npx playwright install chromium
          if ldd ~/.cache/ms-playwright/chromium*/chrome-*/{chrome,headless_shell} 2>/dev/null | grep -q 'not found'; then
            npx playwright install-deps chromium
          fi
      - if: steps.scope.outputs.game == 'true'
        timeout-minutes: 5
        run: |
          node tools/bundle.mjs
          git diff --exit-code -- game/index.html
          node tools/check-game-invariants.mjs origin/main
          node tools/sim/core-test.mjs &
          node tools/sim/core-check.mjs 50 &
          git show origin/main:game/index.html > "$RUNNER_TEMP/main-game.html"
          node tools/test-ci-browser.mjs "$RUNNER_TEMP/main-game.html" &
          fail=0; for j in $(jobs -p); do wait $j || fail=1; done; exit $fail

  # Gemini may merge (Cillian, 2026-10-22). If Gemini's review already said "Verdict: merge" on this commit,
  # merge now that CI is green (.github/scripts/bot-merge.sh has the rules). Quiet otherwise.
  bot-merge:
    needs: ci
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Post CI payback result on money PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, 'money') && needs.ci.outputs.payback != ''
        uses: actions/github-script@v7
        env:
          PAYBACK: ${{ needs.ci.outputs.payback }}
        with:
          script: |
            const marker = '<!-- ci-payback -->';
            const block = `${marker}\nCI payback: ${process.env.PAYBACK}\n<!-- /ci-payback -->`;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            const existing = (pr.body || '').replace(/<!-- ci-payback -->[\s\S]*?<!-- \/ci-payback -->/g, '').trim();
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: context.issue.number,
              body: existing ? `${existing}\n\n${block}` : block,
            });
      - env:
          BOT_MERGER_LOGIN: github-actions[bot]
          GEMINI_REVIEW_LOGIN: ${{ vars.GEMINI_BOT_LOGIN || 'belfast-wheel-gemini[bot]' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BOT_MERGE_MAIN: ${{ vars.BOT_MERGE_MAIN }}
        run: .github/scripts/bot-merge.sh "${{ github.event.pull_request.number }}" Gemini
