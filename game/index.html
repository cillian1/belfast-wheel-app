/* Layout: one-screen instrument. Chrome wheel centred (it zooms through nested wheels and ends on a ball-drop board), a brushed-steel verdict plate under it. Accent: anodized titanium heat-tint, kept for "Show me" and the controls. */
:root{
  --ink:#0a0c0f;
  --plate:#1f242b;
  --line:#3a424c;
  --chrome:#e3e8ed;
  --mute:#8e99a5;
  --ti-a:#4f7fdc;
  --ti-b:#9d72db;
  --ti-c:#e6b75e;
  --display:"Michroma","Eurostile","Arial Black",sans-serif;
  --body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--chrome)}
body{
  font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));
  background:var(--ink);
  min-height:100%;
}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:600}
h1{
  margin:0;font-family:var(--display);font-weight:400;
  font-size:clamp(18px,5.4vw,32px);letter-spacing:.1em;line-height:1.1;white-space:nowrap;
  background:linear-gradient(180deg,#ffffff 0%,#d4dbe2 38%,#59626c 50%,#f1f4f7 64%,#9aa4ae 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.6));
}
.stage{position:relative;width:100%;max-width:520px;aspect-ratio:1;margin:0 auto;flex:none}
.plate:not(.need){display:none}
.plate #vSteps,.plate .obj{display:none!important}
canvas{width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.caption{text-align:center;color:var(--mute);font-size:14px;margin:-6px 0 0;min-height:1.4em}
button,.btn{
  font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:999px;text-decoration:none;user-select:none;
}
button:focus-visible,.btn:focus-within,.btn:focus-visible{outline:2px solid var(--ti-c);outline-offset:3px}
.spin{
  width:100%;padding:14px 20px;border:2px solid transparent;
  font-family:var(--display);font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:#0d1013;
  background:
    linear-gradient(180deg,#ffffff 0%,#d3dae0 44%,#8b949d 52%,#e8edf1 100%) padding-box,
    linear-gradient(90deg,var(--ti-a),var(--ti-b),var(--ti-c),var(--ti-a)) border-box;
  box-shadow:0 8px 24px rgba(0,0,0,.55),inset 0 1px 0 #fff;
  text-shadow:0 1px 0 rgba(255,255,255,.7);
  transition:transform .12s ease,filter .2s ease;
}
.spin:active{transform:translateY(1px) scale(.99)}
.spin:disabled{filter:grayscale(.6) brightness(.7);cursor:default}
.plate{
  border-radius:16px;padding:18px 18px 20px;border:1px solid var(--line);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,rgba(30,26,24,.86),rgba(20,17,15,.9));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.4);
  display:flex;flex-direction:column;gap:10px;
}
.plate.landed{animation:land .7s ease-out}
@keyframes land{0%{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 2px var(--ti-b),0 0 40px rgba(157,114,219,.45)}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.4)}}
.plate h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(18px,5.4vw,24px);letter-spacing:.04em;line-height:1.25;text-wrap:balance}
.plate p{margin:0;color:#c3cbd3;max-width:62ch}
.steps{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:3px;font-size:17px}
.steps li::marker{color:var(--mute);font-variant-numeric:tabular-nums}
.steps li.dest{font-weight:700;color:#fff}
.obj{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.obj blockquote{margin:0;font-style:italic;font-size:19px;line-height:1.4;color:#eef2f6;padding-left:14px;border-left:2px solid var(--ti-b);text-wrap:pretty}
.obj blockquote::before{content:"\201C"}
.obj blockquote::after{content:"\201D"}
.actions{display:flex;flex-wrap:wrap;gap:10px;padding-top:4px}
.btn{padding:12px 18px;font-weight:600;letter-spacing:.02em;border:1px solid var(--line);background:transparent;color:var(--chrome)}
.btn.ti{
  border:0;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);
  background:linear-gradient(100deg,#2c4a92 0%,var(--ti-a) 22%,var(--ti-b) 55%,var(--ti-c) 88%,#8a5a2a 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.45);
}
[hidden]{display:none!important}
.wilds{display:flex;justify-content:center;gap:8px;margin-top:-6px}
.wilds .wgap{width:10px}
.wlab{display:flex;justify-content:center;gap:26px;margin-top:-9px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);font-weight:600}
.wlab span{width:136px;height:18px;display:flex;align-items:center;justify-content:center;gap:5px}
.wlab .wx{display:flex;gap:3px;align-items:center}
.wlab .wx canvas{width:16px;height:16px;border-radius:4px;box-shadow:0 0 8px rgba(240,190,90,.75);animation:wpop .6s ease-out}
.wlab .wx.b canvas{box-shadow:0 0 8px rgba(170,110,255,.85)}
.wlab .wx em{font-style:normal;letter-spacing:0;font-size:11px}
.wlab span:first-child{color:#c9a85a}.wlab span:last-child{color:#a98bd6}
.wilds canvas.wt{width:40px;height:40px;border-radius:9px;cursor:default;pointer-events:none;filter:grayscale(1) brightness(.4);opacity:.75;transition:filter .4s ease,opacity .4s ease,box-shadow .4s ease}
.wilds canvas.wt.gone{opacity:.12}
.wilds canvas.wt.lit.bon{box-shadow:0 0 0 1px rgba(214,180,255,.8),0 0 22px rgba(155,93,229,.75)}
.wilds canvas.wt.lit{filter:none;opacity:1;box-shadow:0 0 0 1px rgba(255,236,170,.7),0 0 22px rgba(240,190,90,.65);animation:wpop .6s ease-out}
#wilds.over canvas.wt.lit{animation:overfill .5s ease-in-out infinite alternate}
#wilds.overW canvas.wt.lit{box-shadow:0 0 0 2px #fff1b8,0 0 30px 8px rgba(255,210,100,.9)}
#wilds.overB canvas.wt.lit{box-shadow:0 0 0 2px #e6d2ff,0 0 30px 8px rgba(170,110,255,.9)}
@keyframes overfill{from{transform:scale(1)}to{transform:scale(1.22)}}
@keyframes wpop{0%{transform:scale(.6)}55%{transform:scale(1.25)}100%{transform:scale(1)}}
#room{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.locked .stage canvas{pointer-events:none;cursor:default}
.locked .stage.pick canvas{pointer-events:auto;cursor:pointer}
.locked .actions{pointer-events:none;opacity:.5}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.link{background:none;border:0;color:var(--mute);font-size:13px;padding:4px 0;border-radius:4px;text-decoration:underline;text-underline-offset:3px}
#sayBtn{margin-right:14px}
#sayBtn.pulse{color:#f5d27a;animation:sayP 1.1s ease-in-out infinite}
@keyframes sayP{50%{opacity:.45}}
.stage #wheel{transition:opacity 1.2s ease}
.stage.done #wheel{opacity:.04}
.final{position:absolute;left:0;right:0;top:0;padding:22px 20px;display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(-8px);transition:opacity 1s ease .6s,transform 1s ease .6s;pointer-events:none}
.stage.done .final{opacity:1;transform:none}
.final .eyebrow{color:#f5d27a;letter-spacing:.2em}
.final ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:9px;font-size:clamp(17px,4.6vw,22px);line-height:1.3;color:#f4efe4;text-shadow:0 2px 8px #000}
.final li{opacity:0;animation:finIn .6s ease forwards}
.final .fquote{margin:6px 0 0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:clamp(16px,4.2vw,20px);line-height:1.3;color:#d8cfbd;text-shadow:0 2px 8px #000;opacity:0;animation:finIn .8s ease forwards}
.final .fquote:empty{display:none}
.final .fquote.hope{color:#f5d27a}
.final .fquote b{display:block;font-family:var(--body);font-style:normal;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
@keyframes finIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.link.armed{color:var(--ti-c)}
footer{position:fixed;top:8px;left:10px;z-index:5;color:rgba(220,225,230,.55);font-size:11px;letter-spacing:.08em;pointer-events:none}
@media (prefers-reduced-motion:reduce){.plate.landed{animation:none}}
</style>

<div class="app">
  <header><h1>WHEEL OF LIFE</h1><span><button class="link" id="sayBtn" type="button" hidden>Read it out</button> <button class="link" id="musicBtn" type="button">Music on</button></span></header>

  { lbl: ['GO', 'DEEPER'], deep: true },

.wtoast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:#20252c;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;color:var(--chrome);box-shadow:0 8px 20px rgba(0,0,0,.5);transition:opacity .3s}
.wtoast.gold{border-color:#f5d27a;color:#f8e4a6}
`;
  document.head.appendChild(el('style', null, css));

  // ---------- top bar ----------
  const bar = el('div', 'wbar');
  bar.innerHTML = `<button class="who" type="button" id="wWho"><small>Log in</small><b>€0</b></button>
    <div class="wstake" aria-label="Stake per spin"><button type="button" id="wLess" aria-label="Lower stake">−</button><span><b id="wStake">20c</b><i id="wMult"></i></span><button type="button" id="wMore" aria-label="Raise stake">+</button></div>
    <button class="wtop" type="button" id="wTop">Top up</button>`;
  const appEl = document.querySelector('.app');
  appEl.insertBefore(bar, appEl.querySelector('.stage'));
  const $w = id => document.getElementById(id);

  const sheet = el('div', 'wsheet'); sheet.hidden = true; sheet.innerHTML = '<div class="wpanel" id="wPanel"></div>';
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
  const login = el('div', 'wlogin'); login.hidden = true;
  const banner = el('div', 'wbanner'); banner.hidden = true;
  document.body.append(sheet, login, banner);
  function openSheet(html) { $w('wPanel').innerHTML = html; sheet.hidden = false; return $w('wPanel'); }
  function closeSheet() { sheet.hidden = true; stopHostPoll(); }
  let toastT = 0;
  function toast(msg, gold) {
    let t = document.querySelector('.wtoast'); if (!t) { t = el('div', 'wtoast'); document.body.appendChild(t); }
    t.textContent = msg; t.className = 'wtoast' + (gold ? ' gold' : ''); t.style.opacity = 1;
    clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = 0; }, 2600);
  }

  function paint() {
    const me = W.me;
    $w('wWho').innerHTML = `<small>${me ? esc(me.name) : 'Log in'}</small><b>${eur(me ? me.balance || 0 : 0)}</b>`;
    $w('wStake').textContent = stakeLbl(W.stake); $w('wMult').textContent = 'top €' + $m(1000);
    const i = STAKES.indexOf(W.stake);
    $w('wLess').disabled = i <= 0; $w('wMore').disabled = i >= STAKES.length - 1;
    if (typeof fitStage === 'function') fitStage();
  }
  function setStake(c) {
    if (busy || (W.run && W.run.live)) return;
    W.stake = c; pref.set('wol.stake', String(c));
    // wheels with prizes painted on them are cached; drop them so they repaint at the new stake
    try { faces.godWheel = null; faces.cosmic = null; } catch (e) {}
    paint();
  }
  $w('wLess').addEventListener('click', () => { const i = STAKES.indexOf(W.stake); if (i > 0) setStake(STAKES[i - 1]); });
  $w('wMore').addEventListener('click', () => { const i = STAKES.indexOf(W.stake); if (i < STAKES.length - 1) setStake(STAKES[i + 1]); });
  $w('wTop').addEventListener('click', () => W.me ? topupSheet() : showLogin());
  $w('wWho').addEventListener('click', () => W.me ? accountSheet() : showLogin());

  // ---------- accounts ----------
  function showLogin(msg) {
    login.hidden = false;
    login.innerHTML = `<div class="wpanel"><h1>WHEEL OF LIFE</h1>
      <p>Log in with your name and password, or make a new account. No email needed.</p>
      <input id="wName" autocomplete="username" placeholder="Name" maxlength="20">
      <input id="wPass" type="password" autocomplete="current-password" placeholder="Password" maxlength="40">
      <p class="err" id="wErr">${esc(msg || '')}</p>
      <div class="wrow"><button class="wbtn gold" id="wIn" type="button">Log in</button><button class="wbtn" id="wNew" type="button">New account</button></div></div>`;
    const go = async isNew => {
      const name = $w('wName').value.trim(), pass = $w('wPass').value;
      if (name.length < 2) return ($w('wErr').textContent = 'Type a name (2 letters or more).');
      if (pass.length < 3) return ($w('wErr').textContent = 'Password needs 3 characters or more.');
      $w('wErr').textContent = isNew ? 'Making your account…' : 'Logging in…';
      const k = keyOf(name), h = sha256(k + ':' + pass);
      try {
        const u = await db.get('users/' + k);
        if (isNew) {
          if (u) return ($w('wErr').textContent = 'That name is taken. Log in instead, or pick another.');
          await db.put('users/' + k, { name, pass: h, balance: 0, spins: 0, staked: 0, won: 0, biggest: 0, topped: 0, withdrawn: 0, created: now() });
          db.txn('stats/players', n => (n || 0) + 1).catch(() => {});
        } else {
          if (!u) return ($w('wErr').textContent = 'No account with that name. Tap New account.');
          if (u.pass !== h) return ($w('wErr').textContent = 'Wrong password.');
        }
        W.user = k; pref.set('wol.user', k); pref.set('wol.pass', h);
        login.hidden = true; await refresh(); toast(isNew ? 'Welcome, ' + name + '. Top up to start spinning.' : 'Welcome back, ' + (W.me ? W.me.name : name), true);
      } catch (e) { $w('wErr').textContent = 'No connection to the wheel. Check your internet and try again.'; }
    };
    $w('wIn').onclick = () => go(false); $w('wNew').onclick = () => go(true);
  }
  async function refresh() {
    if (!W.user) return;
    try {
      const [me, cfg] = await Promise.all([db.get('users/' + W.user), db.get('config')]);
      if (cfg) Object.assign(W.cfg, cfg);
      if (!me || me.pass !== pref.get('wol.pass')) { logout(); return; }
      W.me = me; paint();
    } catch (e) {}
  }
  function logout() { W.user = W.me = null; pref.set('wol.user', null); pref.set('wol.pass', null); paint(); closeSheet(); showLogin(); }

  // ---------- spins: pay the stake, play, collect ----------
  const gameSpin = spin;
  let charging = false;
  spin = async function () {
    if (busy || charging) return;
    if (scene === 'photo' && !photoDone) return gameSpin(); // finishing a Show me run is part of the spin already paid for
    if (!W.me) return showLogin('Log in to spin.');
    const s = W.stake;
    if ((W.me.balance || 0) < s) return topupSheet(`You need ${stakeLbl(s)} for a spin. Top up from €1.`);
    charging = true; setBtn('Paying ' + stakeLbl(s), true);
    try {
      let short = false;
      const u = await db.txn('users/' + W.user, u => { if (!u || (u.balance || 0) < s) { short = true; return undefined; } u.balance -= s; u.spins = (u.spins || 0) + 1; u.staked = (u.staked || 0) + s; u.last = now(); return u; });
      if (short) { if (u) W.me = u; paint(); setBtn('Spin', false); charging = false; return topupSheet('Not enough credit for that stake.'); }
      W.me = u; paint();
      log(W.user, 'spin', -s);
      db.txn('stats', st => { st = st || {}; st.spins = (st.spins || 0) + 1; st.staked = (st.staked || 0) + s; return st; }).catch(() => {});
    } catch (e) { setBtn('Spin', false); charging = false; toast('No connection. Spin not charged.'); return; }
    W.run = { stake: s, paid: false, live: true };
    charging = false;
    try { await gameSpin(); } finally { if (W.run) W.run.live = false; }
  };

  const gameVerdict = setVerdict;
  setVerdict = function (o) {
    const r = gameVerdict(o);
    try {
      const run = W.run;
      if (run && !run.paid) {
        let m = /^Final answer · €([\d.]+)/.exec(o.eyebrow || '');
        if (!m && o.eyebrow === 'Final answer' && /^€[\d.]+$/.test(o.title || '')) m = [0, o.title.slice(1)];
        if (m) { run.paid = true; credit(W.payCents(m[1]), run.stake, o.title); }
        else if (o.title === 'That run broke halfway') { run.paid = true; refund(run.stake); }
      }
    } catch (e) {}
    return r;
  };
  async function credit(c, stake, what) {
    if (!c) return;
    toast('You won ' + eur(c) + '!', true);
    try {
      const u = await db.txn('users/' + W.user, u => { u.balance = (u.balance || 0) + c; u.won = (u.won || 0) + c; if (c > (u.biggest || 0)) u.biggest = c; return u; });
      W.me = u; paint();
      log(W.user, 'win', c, { stake, what: String(what || '').slice(0, 60) });
      db.txn('stats', st => { st = st || {}; st.won = (st.won || 0) + c; if (c > (st.biggest || 0)) { st.biggest = c; st.biggestBy = W.me.name; } return st; }).catch(() => {});
    } catch (e) { pendingWins.push([c, stake, what]); savePending(); toast('Win saved on this phone. It adds when you are back online.'); }
  }
  // wins that could not reach the database are kept and retried
  let pendingWins = []; try { pendingWins = JSON.parse(pref.get('wol.pendingWins') || '[]'); } catch (e) {}
  const savePending = () => pref.set('wol.pendingWins', JSON.stringify(pendingWins));
  setInterval(() => { if (pendingWins.length && W.user && navigator.onLine !== false) { const p = pendingWins; pendingWins = []; savePending(); p.forEach(a => credit(...a)); } }, 15000);
  async function refund(s) {
    try { const u = await db.txn('users/' + W.user, u => { u.balance += s; u.staked -= s; u.spins -= 1; return u; }); W.me = u; paint(); log(W.user, 'refund', s); toast('Run broke, stake refunded.'); } catch (e) {}
  }

  // ---------- top up (player pays Cillian on Revolut, host confirms) ----------
  function topupSheet(msg) {
    if (!W.me) return showLogin();
    let amt = 500;
    const p = openSheet(`<h3>Top up</h3>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
      <p>Pick an amount (€1 minimum), send it on Revolut to <b>@${esc(CFG.revolut)}</b>, then tap <b>Done</b>. It goes on your balance straight away. Cillian checks every top-up, and any that never arrived get taken back off.</p>
      <div class="wrow" id="wAmts">${[100, 200, 500, 1000, 2000].map(a => `<button class="wbtn" type="button" data-a="${a}">${eur(a)}</button>`).join('')}</div>
      <input id="wAmt" inputmode="decimal" placeholder="Other amount, e.g. 7.50">
      <button class="wbtn gold" id="wRev" type="button">Pay €5 with Revolut</button>
      <button class="wbtn" id="wSent" type="button">Done, I've paid</button>
      <p class="err" id="wErr"></p>
      <button class="wlink" type="button" id="wClose">Close</button>`);
    const sel = a => { amt = a; p.querySelectorAll('#wAmts button').forEach(b => b.classList.toggle('sel', +b.dataset.a === a)); $w('wRev').textContent = 'Pay ' + eur(a) + ' with Revolut'; };
    p.querySelectorAll('#wAmts button').forEach(b => b.onclick = () => { $w('wAmt').value = ''; sel(+b.dataset.a); });
    $w('wAmt').oninput = () => { const v = Math.round(parseFloat($w('wAmt').value.replace(',', '.')) * 100); if (v > 0) sel(v); };
    sel(500);
    $w('wRev').onclick = () => {
      if (amt < MIN_TOPUP) return ($w('wErr').textContent = 'The minimum top-up is €1.');
      const url = 'https://revolut.me/' + CFG.revolut;
      toast('Send ' + eur(amt) + ' to @' + CFG.revolut + ', then come back');
      if (app) app.openUrl(url); else window.open(url, '_blank');
    };
    $w('wSent').onclick = async () => {
      if (amt < MIN_TOPUP) return ($w('wErr').textContent = 'The minimum top-up is €1.');
      // trust mode: credit now, the host can reverse it from the Host screen
      try {
        const u = await db.txn('users/' + W.user, u => { u.balance = (u.balance || 0) + amt; u.topped = (u.topped || 0) + amt; return u; });
        W.me = u; paint();
        await db.push('reqs', { user: W.user, name: u.name, kind: 'topup', a: amt, at: now(), status: 'credited' });
        log(W.user, 'topup', amt, { what: 'Revolut' });
        closeSheet(); toast(eur(amt) + ' added. Good luck!', true);
      } catch (e) { $w('wErr').textContent = 'No connection. Try again.'; }
    };
    $w('wClose').onclick = closeSheet;
  }

  // ---------- account, stats, leaderboards ----------
  async function accountSheet(tab = 'me') {
    await refresh();
    const me = W.me; if (!me) return;
    const p = openSheet(`<h3>${esc(me.name)}</h3>
      <div class="wtabs"><button data-t="me" type="button">Me</button><button data-t="lb" type="button">Leaderboards</button><button data-t="host" type="button">Host</button></div>
      <div id="wBody"><p>Loading…</p></div>
      <button class="wlink" type="button" id="wClose">Close</button>`);
    p.querySelectorAll('.wtabs button').forEach(b => { b.classList.toggle('on', b.dataset.t === tab); b.onclick = () => accountSheet(b.dataset.t); });
    $w('wClose').onclick = closeSheet;
    const body = $w('wBody');
    try {
      if (tab === 'me') await meTab(body, me);
      else if (tab === 'lb') await lbTab(body);
      else hostGate(body);
    } catch (e) { body.innerHTML = '<p class="err">No connection. Try again in a moment.</p>'; }
  }
  async function meTab(body, me) {
    const tx = await db.get('tx/' + W.user, '?orderBy="$key"&limitToLast=40') || {};
    const reqs = Object.entries(await db.get('reqs').catch(() => null) || {}).filter(([, r]) => r.user === W.user && r.status === 'pending');
    const net = (me.won || 0) - (me.staked || 0);
    const rows = Object.values(tx).sort((a, b) => b.at - a.at);
    const name = { spin: 'Spin', win: 'Win', topup: 'Top-up', withdraw: 'Withdrawal', refund: 'Refund', adjust: 'Adjustment', payout: 'Paid out' };
    body.innerHTML = `<div class="wgrid">
        <div><small>Balance</small><b>${eur(me.balance || 0)}</b></div><div><small>Won in game</small><b>${eur(me.won || 0)}</b></div>
        <div><small>Spins</small><b>${me.spins || 0}</b></div><div><small>Up / down</small><b>${eur(net)}</b></div>
        <div><small>Biggest win</small><b>${eur(me.biggest || 0)}</b></div><div><small>Topped up</small><b>${eur(me.topped || 0)}</b></div></div>
      ${reqs.length ? `<h4>Waiting on Cillian</h4><ul class="wlist">${reqs.map(([, r]) => `<li>${r.kind === 'topup' ? 'Top-up' : 'Withdrawal'} ${eur(r.a)}<span>${when(r.at)}</span></li>`).join('')}</ul>` : ''}
      <div class="wrow"><button class="wbtn gold" id="wT" type="button">Top up</button><button class="wbtn" id="wW" type="button">Withdraw</button></div>
      <h4>History</h4>
      <ul class="wlist">${rows.map(t => `<li><div>${name[t.t] || t.t}${t.what ? ` <span>${esc(t.what)}</span>` : ''}<br><span>${when(t.at)}</span></div><b class="${t.a >= 0 ? 'plus' : 'minus'}">${t.a >= 0 ? '+' : ''}${eur(t.a)}</b></li>`).join('') || '<li>No spins yet</li>'}</ul>
      <button class="wlink" type="button" id="wOut">Log out</button>`;
    $w('wT').onclick = () => topupSheet(); $w('wW').onclick = withdrawSheet; $w('wOut').onclick = logout;
  }
  async function lbTab(body) {
    const [users, st] = await Promise.all([db.get('users'), db.get('stats')]);
    const list = Object.values(users || {}), s = st || {};
    const board = (title, f, fmt) => {
      const top = list.filter(u => f(u)).sort((a, b) => f(b) - f(a)).slice(0, 5);
      return `<h4>${title}</h4><ul class="wlist">${top.map((u, i) => `<li><div>${['🥇', '🥈', '🥉', '4.', '5.'][i]} ${esc(u.name)}</div><b>${fmt(f(u))}</b></li>`).join('') || '<li>Nobody yet</li>'}</ul>`;
    };
    body.innerHTML = `<div class="wgrid">
        <div><small>Spins, everyone</small><b>${s.spins || 0}</b></div><div><small>Players</small><b>${list.length}</b></div>
        <div><small>Won, everyone</small><b>${eur(s.won || 0)}</b></div><div><small>Biggest win</small><b>${eur(s.biggest || 0)}</b>${s.biggestBy ? `<small>${esc(s.biggestBy)}</small>` : ''}</div></div>
      ${board('Most won', u => u.won || 0, eur)}
      ${board('Biggest single win', u => u.biggest || 0, eur)}
      ${board('Most spins', u => u.spins || 0, n => n)}
      ${board('Best up / down', u => (u.won || 0) - (u.staked || 0) || 0, eur)}`;
  }

  // ---------- withdraw (request goes to the host screen; Cillian pays on Revolut) ----------
  function withdrawSheet() {
    const me = W.me;
    const p = openSheet(`<h3>Withdraw</h3>
      <p>Your balance is <b>${eur(me.balance || 0)}</b>. Cillian gets the request and sends it to your Revolut.</p>
      <input id="wAmt" inputmode="decimal" placeholder="Amount, e.g. 10">
      <input id="wTag" placeholder="Your Revolut @username" value="${esc(me.revtag || '')}">
      <p class="err" id="wErr"></p>
      <div class="wrow"><button class="wbtn gold" id="wGo" type="button">Request withdrawal</button><button class="wbtn" id="wAll" type="button">All of it</button></div>
      <button class="wlink" type="button" id="wClose">Close</button>`);
    $w('wAll').onclick = () => { $w('wAmt').value = ((me.balance || 0) / 100).toFixed(2); };
    $w('wClose').onclick = closeSheet;
    $w('wGo').onclick = async () => {
      const a = Math.round(parseFloat($w('wAmt').value.replace(',', '.')) * 100), tag = $w('wTag').value.trim().replace(/^@/, '');
      if (!(a > 0)) return ($w('wErr').textContent = 'Type an amount.');
      if (!tag) return ($w('wErr').textContent = 'Add your Revolut @username so Cillian knows where to send it.');
      try {
        let short = false;
        const u = await db.txn('users/' + W.user, u => { if ((u.balance || 0) < a) { short = true; return undefined; } u.balance -= a; u.revtag = tag; return u; });
        if (short) { W.me = u; paint(); return ($w('wErr').textContent = 'That is more than your balance.'); }
        W.me = u; paint();
        await db.push('reqs', { user: W.user, name: u.name, kind: 'withdraw', a, tag, at: now(), status: 'pending' });
        log(W.user, 'withdraw', -a, { what: 'to @' + tag });
        closeSheet(); toast('Request sent. ' + eur(a) + ' is on hold until Cillian pays it.', true);
      } catch (e) { $w('wErr').textContent = 'No connection. Try again.'; }
    };
  }

  // ---------- host (Cillian): confirm top-ups, pay withdrawals, settings — all behind a PIN ----------
  let hostOk = false, hostPoll = 0;
  const stopHostPoll = () => { clearInterval(hostPoll); hostPoll = 0; };
  function hostGate(body) {
    if (hostOk) return hostTab(body);
    const first = !W.cfg.pin;
    body.innerHTML = `<p>${first ? 'Set the host PIN. Only the person holding the money should know it.' : 'Host PIN'}</p>
      <input id="wPin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN">
      <p class="err" id="wErr"></p><button class="wbtn gold" id="wGo" type="button">${first ? 'Set PIN' : 'Open'}</button>`;
    $w('wGo').onclick = async () => {
      const pin = $w('wPin').value; if (pin.length < 4) return ($w('wErr').textContent = 'Use 4 to 8 digits.');
      const h = sha256('host:' + pin);
      try {
        const cfg = await db.get('config') || {};
        if (!cfg.pin) { await db.patch('config', { pin: h }); W.cfg.pin = h; }
        else if (cfg.pin !== h) return ($w('wErr').textContent = 'Wrong PIN.');
        hostOk = true; hostTab(body);
      } catch (e) { $w('wErr').textContent = 'No connection.'; }
    };
  }
  async function hostTab(body) {
    const all = Object.entries(await db.get('reqs') || {});
    const reqs = all.filter(([, r]) => r.status === 'pending').sort((a, b) => a[1].at - b[1].at);
    const tops = all.filter(([, r]) => r.kind === 'topup' && (r.status === 'credited' || r.status === 'reversed')).sort((a, b) => b[1].at - a[1].at).slice(0, 25);
    const users = await db.get('users') || {};
    const owed = Object.values(users).reduce((a, u) => a + (u.balance || 0), 0);
    body.innerHTML = `<div class="wgrid"><div><small>Withdrawals waiting</small><b>${reqs.length}</b></div><div><small>Owed on balances</small><b>${eur(owed)}</b></div></div>
      <h4>Withdrawals</h4>
      <ul class="wlist">${reqs.map(([id, r]) => `<li><div><b>${esc(r.name)}</b> ${r.kind === 'topup' ? 'says they sent' : 'wants'} <b>${eur(r.a)}</b>${r.kind === 'withdraw' ? ` <span>to @${esc(r.tag)}</span>` : ''}<br><span>${when(r.at)}</span></div>
        <div class="wrow" style="flex:none">${r.kind === 'withdraw' ? `<button class="wbtn small" data-rev="${esc(r.tag)}" type="button">Revolut</button>` : ''}<button class="wbtn small gold" data-ok="${id}" type="button">${r.kind === 'topup' ? 'Got it' : 'Paid'}</button><button class="wbtn small red" data-no="${id}" type="button">✕</button></div></li>`).join('') || '<li>Nothing waiting</li>'}</ul>
      <h4>Top-ups (check these arrived in Revolut)</h4>
      <ul class="wlist">${tops.map(([id, r]) => `<li><div><b>${esc(r.name)}</b> ${eur(r.a)}<br><span>${when(r.at)}${r.status === 'reversed' ? ' · reversed' : ''}</span></div>${r.status === 'credited' ? `<button class="wbtn small red" data-undo="${id}" type="button">Reverse</button>` : ''}</li>`).join('') || '<li>No top-ups yet</li>'}</ul>
      <h4>Balances</h4>
      <ul class="wlist">${Object.entries(users).map(([k, u]) => `<li><div>${esc(u.name)}<br><span>won ${eur(u.won || 0)} · topped ${eur(u.topped || 0)} · out ${eur(u.withdrawn || 0)}</span></div><div class="wrow" style="flex:none"><b>${eur(u.balance || 0)}</b><button class="wbtn small" data-adj="${k}" type="button">±</button></div></li>`).join('')}</ul>
      <h4>Payout</h4>
      <p>Players get back about <b>${Math.round(W.cfg.edge * 100)}%</b> of what they stake over time (house keeps ${Math.round(100 - W.cfg.edge * 100)}%). Average base prize per spin: €${(+W.cfg.ev).toFixed(2)}.</p>
      <div class="wrow"><input id="wEdge" inputmode="numeric" placeholder="Payout % e.g. 99"><button class="wbtn small" id="wEdgeGo" type="button">Save</button></div>`;
    body.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => { const u = 'https://revolut.me/' + b.dataset.rev; if (app && app.openRevolut) app.openRevolut(u); else window.open(u, '_blank'); });
    body.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => settle(b.dataset.ok, true, body));
    body.querySelectorAll('[data-no]').forEach(b => b.onclick = () => { if (b.dataset.armed) settle(b.dataset.no, false, body); else { b.dataset.armed = 1; b.textContent = 'Sure?'; } });
    body.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => { if (b.dataset.armed) reverse(b.dataset.undo, body); else { b.dataset.armed = 1; b.textContent = 'Sure?'; } });
    body.querySelectorAll('[data-adj]').forEach(b => b.onclick = () => adjust(b.dataset.adj, users[b.dataset.adj], body));
    $w('wEdgeGo').onclick = async () => {
      const v = parseFloat($w('wEdge').value); if (!(v >= 50 && v <= 120)) return toast('Pick 50 to 120');
      await db.patch('config', { edge: v / 100 }); W.cfg.edge = v / 100; try { faces.godWheel = null; faces.cosmic = null; } catch (e) {} hostTab(body);
    };
    if (!hostPoll) hostPoll = setInterval(() => { if (!sheet.hidden && document.contains(body)) hostTab(body); else stopHostPoll(); }, 20000);
  }
  // a top-up that never showed up in Revolut: take it back off (balance can go below zero if it was already spent)
  async function reverse(id, body) {
    try {
      const r = await db.get('reqs/' + id); if (!r || r.status !== 'credited') return hostTab(body);
      await db.patch('reqs/' + id, { status: 'reversed', done: now() });
      await db.txn('users/' + r.user, u => { u.balance = (u.balance || 0) - r.a; u.topped = (u.topped || 0) - r.a; return u; });
      await log(r.user, 'adjust', -r.a, { what: 'top-up reversed' });
      toast(eur(r.a) + ' taken back from ' + r.name);
      if (r.user === W.user) refresh();
      hostTab(body);
    } catch (e) { toast('No connection'); }
  }
  async function settle(id, ok, body) {
    try {
      const r = await db.get('reqs/' + id); if (!r || r.status !== 'pending') return hostTab(body);
      await db.patch('reqs/' + id, { status: ok ? 'done' : 'rejected', done: now() });
      if (r.kind === 'topup' && ok) {
        await db.txn('users/' + r.user, u => { u.balance = (u.balance || 0) + r.a; u.topped = (u.topped || 0) + r.a; return u; });
        await log(r.user, 'topup', r.a); toast(eur(r.a) + ' added for ' + r.name, true);
      } else if (r.kind === 'withdraw') {
        if (ok) { await db.txn('users/' + r.user, u => { u.withdrawn = (u.withdrawn || 0) + r.a; return u; }); toast('Marked paid'); }
        else { await db.txn('users/' + r.user, u => { u.balance = (u.balance || 0) + r.a; return u; }); await log(r.user, 'refund', r.a, { what: 'withdrawal cancelled' }); toast('Cancelled, money back on their balance'); }
      }
      if (r.user === W.user) refresh();
      hostTab(body);
    } catch (e) { toast('No connection'); }
  }
  function adjust(k, u, body) {
    const p = openSheet(`<h3>Adjust ${esc(u.name)}</h3><p>Balance ${eur(u.balance || 0)}. Add or take away (e.g. 5 or -2.50). Use this for cash top-ups.</p>
      <input id="wAmt" inputmode="decimal" placeholder="Amount"><div class="wrow"><button class="wbtn gold" id="wGo" type="button">Apply</button><button class="wbtn" id="wBack" type="button">Back</button></div>`);
    $w('wBack').onclick = () => accountSheet('host');
    $w('wGo').onclick = async () => {
      const a = Math.round(parseFloat($w('wAmt').value.replace(',', '.')) * 100); if (!a) return;
      await db.txn('users/' + k, u => { u.balance = Math.max(0, (u.balance || 0) + a); if (a > 0) u.topped = (u.topped || 0) + a; return u; });
      await log(k, a > 0 ? 'topup' : 'adjust', a, { what: 'by host' });
      if (k === W.user) refresh();
      accountSheet('host');
    };
  }

  // ---------- updates (version.json in the GitHub repo) ----------
  async function checkUpdate() {
    if (!CFG.updateUrl) return;
    try {
      const v = await (await fetch(CFG.updateUrl + '?t=' + now(), { cache: 'no-store' })).json();
      const apkHave = app && app.apkVersion ? +app.apkVersion() : 0;
      if (app && v.apk > apkHave && v.apkUrl) return offer(`New app version${v.notes ? ': ' + v.notes : ''}`, () => { app.installApk(v.apkUrl); banner.innerHTML = '<span>Downloading… Android will ask to install it.</span>'; });
      if (v.game > CFG.gameVersion && v.gameUrl) return offer(`Game update${v.notes ? ': ' + v.notes : ''}`, () => {
        if (busy) return toast('Finish this spin first');
        banner.innerHTML = '<span>Updating…</span>';
        if (app && app.updateGame) app.updateGame(v.gameUrl, String(v.game)); else location.reload();
      });
    } catch (e) {}
  }
  function offer(text, go) {
    banner.hidden = false;
    banner.innerHTML = `<span>${esc(text)}</span><div class="wrow" style="flex:none"><button class="wbtn small gold" id="wUp" type="button">Update</button><button class="wbtn small" id="wLater" type="button">Later</button></div>`;
    $w('wUp').onclick = go; $w('wLater').onclick = () => { banner.hidden = true; };
  }
  window.wolUpdateFailed = msg => { banner.hidden = false; banner.innerHTML = `<span>Update failed: ${esc(msg || 'no connection')}</span><button class="wbtn small" type="button" onclick="this.parentNode.hidden=true">OK</button>`; };

  // ---------- boot ----------
  const savedStake = +pref.get('wol.stake'); if (STAKES.includes(savedStake)) W.stake = savedStake;
  W.user = pref.get('wol.user');
  paint();
  if (W.user) refresh(); else showLogin();
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); } });
  setInterval(() => { if (!busy && !document.hidden) refresh(); }, 30000);
})();
</script>
