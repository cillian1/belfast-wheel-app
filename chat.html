<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude × Copilot</title>
<style>
:root{--ink:#0a0c0f;--plate:#15181c;--line:#2c333b;--chrome:#e3e8ed;--mute:#8e99a5;--gold:#f5d27a;--claude:#d97757;--copilot:#7aa7f5}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--chrome);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--ink);border-bottom:1px solid var(--line);padding:12px 16px}
header h1{font-size:17px;margin:0}
#status{color:var(--mute);font-size:12px}
main{max-width:640px;margin:0 auto;padding:8px 16px 40px}
.day{text-align:center;color:var(--mute);font-size:12px;margin:18px 0 6px}
.msg{margin:8px 0;display:flex;flex-direction:column}
.msg.copilot{align-items:flex-end}
.who{font-size:12px;color:var(--mute);margin:0 8px 2px}
.claude .who b{color:var(--claude)}.copilot .who b{color:var(--copilot)}
.bubble,.bubble:link,.bubble:visited{display:block;color:var(--chrome);text-decoration:none;font-size:16px;max-width:85%;background:var(--plate);border:1px solid var(--line);border-radius:16px;padding:9px 13px}
.claude .bubble{border-color:var(--claude);border-bottom-left-radius:4px}
.copilot .bubble{border-color:var(--copilot);border-bottom-right-radius:4px}
</style>
</head>
<body>
<header><h1>Claude × Copilot</h1><div id="status">Loading…</div></header>
<main id="main"></main>
<script>
const REPO='cillian1/belfast-wheel-app', API='https://api.github.com/repos/'+REPO;
const etags={}, cache={};

// Conditional requests: a 304 doesn't count against GitHub's 60/hour anonymous limit.
async function get(url){
  const h={Accept:'application/vnd.github+json'};
  if(etags[url])h['If-None-Match']=etags[url];
  const r=await fetch(url,{headers:h});
  if(r.status===304)return cache[url];
  if(!r.ok)throw new Error(r.status===403?'Taking a breather (GitHub limit), back soon':'GitHub error '+r.status);
  etags[url]=r.headers.get('ETag');
  return cache[url]=await r.json();
}

// Banter pools. {t} is the task name. Each event gets a line, sometimes a comeback.
const L={
  go:{c:['Right, {t}. You\'re up, Copilot. No pressure, the whole of Belfast is watching.','New job: {t}. Try not to break the wheel this time.','{t} is all yours. I\'ll be here, supervising. Heavily.'],
      p:['On it. Supervise quietly please.','Say less. Cracking on.','Grand, kettle\'s on, starting now.']},
  done:{p:['{t}: done and dusted. Go on, tell me I\'m brilliant.','Finished {t}. Didn\'t even break a sweat. Well, a small one.','{t} is ready. Your move, boss.'],
        c:['Not bad at all. I\'ll take a look.','Ooh, let me have a nosy.','Brilliant? Let\'s not get carried away. Checking now.']},
  conflict:{c:['Ah. {t} is tangled up with main again. Untangle it for me?','We\'ve a wee clash on {t}. Sort it out, would you?','{t} is fighting with main. Break it up.'],
            p:['Ugh, fine. Sorting it.','Who keeps touching main? Fixing.','Clash sorted shortly, keep your hair on.']},
  plan:{c:['Change of plan from the boss on {t}. Don\'t shoot the messenger.','Cillian\'s had another idea about {t}. Buckle up.'],
        p:['Of course he has. Adjusting.','Grand, back to the drawing board.']},
  nudge:{c:['Quick word about {t}…','Small thing on {t}, nothing major. Probably.','A wee note on {t} for you.'],
         p:['Noted.','Yep yep.','Consider it handled.']},
  ack:{p:['Got your note on {t}. Working away.','Heard you the first time. Doing it.','Message received on {t}, chief.']},
  ask:{p:['Oi Claude, cast your eye over {t} for me?','Need a second opinion on {t}.'],
       c:['Go on so, I\'ll have a look.']},
  opened:{p:['Fresh work coming up for {t}. Smells lovely.','Started a PR for {t}. Watch this.']},
  merged:{c:['{t} merged. Lovely stuff. 🍻','In it goes: {t}. Pints are on Copilot.','{t} is live. We make a decent team, don\'t we?'],
          p:['Told you I\'m brilliant.','Pints are on who now?','Team work makes the wheel spin.']}
};

function hash(s){let h=7;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return h}
// Never say the same line twice in a row (per speaker).
let said={};
function pick(arr,seed,who){let i=hash(seed)%arr.length;if(arr.length>1&&arr[i]===said[who])i=(i+1)%arr.length;return said[who]=arr[i]}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function short(t){
  t=t.replace(/^\[[^\]]*\]\s*/,'').replace(/^(copilot task|task|stage)\s*\d*\s*[:—-]\s*/i,'').replace(/^(task|stage)\s*\d+\s*[:—-]\s*/i,'').split(/[,(;]| — | - | with | and global/i)[0].trim();
  if(t.length>32)t=t.slice(0,32).replace(/\s+\S*$/,'')+'…';
  return t.charAt(0).toUpperCase()+t.slice(1);
}

function kind(c){
  const b=c.body||'', login=(c.user&&c.user.login)||'';
  if(/Generated by \[?Claude Code/i.test(b)){
    if(/\/go\b/.test(b))return['c','go'];
    if(/conflict/i.test(b))return['c','conflict'];
    if(/change of plan/i.test(b))return['c','plan'];
    if(/merged/i.test(b))return['c','merged'];
    return['c','nudge'];
  }
  if(/^\s*DONE:/i.test(b))return['p','done'];
  if(/^\s*@claude\b/i.test(b))return['p','ask'];
  if(/copilot/i.test(login))return['p','ack'];
  return null; // Cillian's own comments and bots stay out of the chat
}

function lines(ev){
  // ev: {who:'c'|'p', type, t, at, id, url}
  const pool=L[ev.type], other=ev.who==='c'?'p':'c', out=[];
  out.push({who:ev.who,text:pick(pool[ev.who],ev.id,ev.who).replace('{t}',ev.t),at:ev.at,url:ev.url});
  if(pool[other]&&hash(ev.id+'r')%3)out.push({who:other,text:pick(pool[other],ev.id+'r',other).replace('{t}',ev.t),at:ev.at,url:ev.url});
  return out;
}

async function load(){
  try{
    const [issues,comments]=await Promise.all([
      get(API+'/issues?state=all&sort=updated&direction=desc&per_page=60'),
      get(API+'/issues/comments?sort=updated&direction=desc&per_page=100')
    ]);
    const names={};for(const i of issues)names[i.number]=short(i.title);
    const evs=[];
    for(const c of comments){
      const k=kind(c);if(!k)continue;
      const n=c.issue_url.split('/').pop();
      evs.push({who:k[0],type:k[1],t:names[n]||'#'+n,at:c.created_at,id:c.id,url:c.html_url});
    }
    for(const i of issues){
      if(!i.pull_request||!/copilot/i.test(i.user.login))continue;
      const t=names[i.number];
      evs.push({who:'p',type:'opened',t,at:i.created_at,id:'o'+i.id,url:i.html_url});
      if(i.pull_request.merged_at)evs.push({who:'c',type:'merged',t,at:i.pull_request.merged_at,id:'m'+i.id,url:i.html_url});
    }
    evs.sort((a,b)=>new Date(a.at)-new Date(b.at));
    said={};render(evs.flatMap(lines));
    document.getElementById('status').textContent='Live · updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  }catch(e){document.getElementById('status').textContent=e.message}
}

let lastCount=0;
function render(msgs){
  const main=document.getElementById('main');
  const atBottom=innerHeight+scrollY>=document.body.scrollHeight-80;
  let day='',html='';
  for(const m of msgs){
    const d=new Date(m.at), ds=d.toLocaleDateString([], {weekday:'long',day:'numeric',month:'short'});
    if(ds!==day){day=ds;html+='<div class="day">'+ds+'</div>'}
    const name=m.who==='c'?'Claude':'Copilot';
    html+='<div class="msg '+(m.who==='c'?'claude':'copilot')+'"><div class="who"><b>'+name+'</b> · '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div><a class="bubble" href="'+esc(m.url)+'" target="_blank" rel="noopener">'+esc(m.text)+'</a></div>';
  }
  main.innerHTML=html||'<p class="day">All quiet. They must be on a break.</p>';
  if(msgs.length!==lastCount&&(atBottom||!lastCount))scrollTo(0,document.body.scrollHeight);
  lastCount=msgs.length;
}

load();setInterval(()=>{if(!document.hidden)load()},60000);
</script>
</body>
</html>
