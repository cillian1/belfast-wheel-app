<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude × Copilot</title>
<style>
:root{--ink:#0a0c0f;--plate:#15181c;--line:#2c333b;--chrome:#e3e8ed;--mute:#8e99a5;--gold:#f5d27a;--claude:#d97757;--copilot:#7aa7f5;--you:#9be38a}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--chrome);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--ink);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:var(--plate);color:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
#status{color:var(--mute);font-size:12px;padding:6px 16px}
main{max-width:760px;margin:0 auto;padding:0 16px 40px}
.thread{display:block;width:100%;text-align:left;background:var(--plate);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;color:inherit;font:inherit;cursor:pointer}
.thread b{display:block}
.thread small{color:var(--mute)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:6px;color:var(--mute)}
.msg{margin:12px 0;display:flex;flex-direction:column}
.msg.copilot{align-items:flex-end}
.who{font-size:12px;color:var(--mute);margin:0 6px 3px}
.bubble{max-width:88%;background:var(--plate);border:1px solid var(--line);border-radius:14px;padding:10px 12px;overflow-wrap:anywhere}
.claude .bubble{border-color:var(--claude);border-bottom-left-radius:4px}
.copilot .bubble{border-color:var(--copilot);border-bottom-right-radius:4px}
.you .bubble{border-color:var(--you)}
.claude .who b{color:var(--claude)}.copilot .who b{color:var(--copilot)}.you .who b{color:var(--you)}
.bubble pre{background:var(--ink);padding:8px;border-radius:8px;overflow-x:auto;white-space:pre-wrap}
.bubble code{background:var(--ink);padding:0 4px;border-radius:4px}
.bubble a{color:var(--gold)}
.bubble img{max-width:100%}
</style>
</head>
<body>
<header><button id="back" hidden>←</button><h1 id="title">Claude × Copilot</h1><button id="refresh">↻</button></header>
<div id="status">Loading…</div>
<main id="main"></main>
<script>
const REPO='cillian1/belfast-wheel-app', API='https://api.github.com/repos/'+REPO;
const etags={}, cache={};
let threads={}, open=null;

// Conditional requests: a 304 doesn't count against GitHub's 60/hour anonymous limit.
async function get(url){
  const h={Accept:'application/vnd.github+json'};
  if(etags[url])h['If-None-Match']=etags[url];
  const r=await fetch(url,{headers:h});
  if(r.status===304)return cache[url];
  if(!r.ok)throw new Error(r.status===403?'GitHub rate limit hit, retrying soon':'GitHub error '+r.status);
  etags[url]=r.headers.get('ETag');
  return cache[url]=await r.json();
}

function who(c){
  const login=(c.user&&c.user.login)||'';
  if(/Generated by \[?Claude Code/i.test(c.body||''))return['claude','Claude'];
  // Copilot posts DONE notes and @claude asks through Cillian's account.
  if(/copilot/i.test(login)||/^\s*(DONE:|@claude\b)/i.test(c.body||''))return['copilot','Copilot'];
  if(/\[bot\]$/.test(login))return['bot',login.replace('[bot]','')];
  return['you',login];
}

function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function md(s){
  s=(s||'').replace(/\n*---\s*\n_Generated by \[Claude Code\][^\n]*_?\s*$/,'').replace(/<!--[\s\S]*?-->/g,'').trim();
  const blocks=[];
  s=esc(s).replace(/```[^\n]*\n([\s\S]*?)```/g,(_,c)=>{blocks.push('<pre>'+c+'</pre>');return'\u0000'+(blocks.length-1)+'\u0000'});
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>')
     .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
     .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
     .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>')
     .replace(/\n/g,'<br>');
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
}
function ago(t){const m=(Date.now()-new Date(t))/6e4;return m<1?'just now':m<60?Math.round(m)+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'}

async function load(){
  try{
    const [issues,comments]=await Promise.all([
      get(API+'/issues?state=all&sort=updated&direction=desc&per_page=60'),
      get(API+'/issues/comments?sort=updated&direction=desc&per_page=100')
    ]);
    threads={};
    for(const i of issues)threads[i.number]={n:i.number,title:i.title,pr:!!i.pull_request,state:i.state,url:i.html_url,first:i,msgs:[]};
    for(const c of comments){
      const n=+c.issue_url.split('/').pop();
      (threads[n]=threads[n]||{n,title:'#'+n,url:c.html_url.split('#')[0],msgs:[]}).msgs.push(c);
    }
    for(const t of Object.values(threads)){
      if(t.first&&t.first.body)t.msgs.push(t.first);
      t.msgs.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
      t.last=t.msgs.length?t.msgs[t.msgs.length-1].created_at:(t.first&&t.first.updated_at);
    }
    document.getElementById('status').textContent='Updated '+new Date().toLocaleTimeString()+' · refreshes every minute';
    render();
  }catch(e){document.getElementById('status').textContent=e.message}
}

function render(){
  const main=document.getElementById('main'), back=document.getElementById('back'), title=document.getElementById('title');
  if(open&&threads[open]){
    const t=threads[open];
    back.hidden=false;title.textContent='#'+t.n+' '+t.title;
    main.innerHTML='<p><a style="color:var(--gold)" href="'+t.url+'" target="_blank" rel="noopener">Open on GitHub</a></p>'+
      t.msgs.map(c=>{const[k,name]=who(c);return'<div class="msg '+k+'"><div class="who"><b>'+esc(name)+'</b> · '+ago(c.created_at)+'</div><div class="bubble">'+md(c.body)+'</div></div>'}).join('')||'<p>No messages yet.</p>';
    return;
  }
  back.hidden=true;title.textContent='Claude × Copilot';
  const list=Object.values(threads).filter(t=>t.msgs.some(c=>who(c)[0]!=='you')).sort((a,b)=>new Date(b.last)-new Date(a.last));
  main.innerHTML=list.map(t=>{
    const c=t.msgs[t.msgs.length-1],[,name]=who(c),preview=md(c.body).replace(/<[^>]+>/g,' ').slice(0,110);
    return'<button class="thread" data-n="'+t.n+'"><b><span class="tag">'+(t.pr?'PR':'Issue')+' #'+t.n+'</span>'+esc(t.title)+'</b><small>'+esc(name)+': '+preview+' · '+ago(t.last)+'</small></button>';
  }).join('')||'<p>No conversations yet.</p>';
}

document.getElementById('main').onclick=e=>{const b=e.target.closest('.thread');if(b){open=b.dataset.n;location.hash=open;render();scrollTo(0,0)}};
document.getElementById('back').onclick=()=>{open=null;history.replaceState(null,'',location.pathname);render()};
document.getElementById('refresh').onclick=load;
open=location.hash.slice(1)||null;
load();setInterval(()=>{if(!document.hidden)load()},60000);
</script>
</body>
</html>
