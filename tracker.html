<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Update tracker · Wheel of Life</title>
<style>
:root{--ink:#0a0c0f;--plate:#15181c;--line:#2c333b;--chrome:#e3e8ed;--mute:#8e99a5;--gold:#f5d27a;--claude:#d97757;--copilot:#7aa7f5;--gemini:#b48cf2;--rolexg:#4fd1b5;--jimini:#f27aa8;--gambler:#e8b04a;--good:#74d39b;--bad:#ff7979;--pending:#f5d27a}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--chrome);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:sticky;top:0;z-index:3;background:#0a0c0fee;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}#refresh{color:var(--mute);font-size:12px}main{max-width:1500px;margin:auto;padding:24px 28px 60px}.blocked{display:none;background:#371b1b;border:1px solid #874343;border-left:4px solid var(--bad);padding:14px 18px;margin-bottom:18px;border-radius:7px}.blocked h2{font-size:15px;color:var(--bad);margin:0 0 8px}.blocked a{color:var(--chrome)}.hero{display:flex;align-items:stretch;gap:14px;margin-bottom:20px}.card{background:var(--plate);border:1px solid var(--line);border-radius:9px;padding:18px}.update{flex:1}.update h2{font-size:24px;margin:0 0 4px}.sub{color:var(--mute)}.branch{color:var(--gold);font-family:ui-monospace,monospace}.progress{width:260px;display:flex;flex-direction:column;justify-content:center}.progress strong{font-size:21px}.track{height:8px;background:#30363d;border-radius:8px;overflow:hidden;margin:10px 0 4px}.track i{height:100%;display:block;background:var(--good);width:0}.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}.section-title h2{font-size:17px;margin:0}.section-title span{font-size:12px;color:var(--mute)}.table-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--plate)}table{border-collapse:collapse;width:100%;table-layout:fixed}th{text-align:left;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.07em;background:#111418}th,td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}td a{color:var(--gold);text-decoration:none}td a:hover{text-decoration:underline}.task{font-weight:600;overflow-wrap:anywhere}.owner{font-weight:650}.owner::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--owner);margin-right:7px}.o-copilot{--owner:var(--copilot)}.o-rolexg{--owner:var(--rolexg)}.o-jimini{--owner:var(--jimini)}.o-gambler{--owner:var(--gambler)}.o-claude{--owner:var(--claude)}.o-gemini{--owner:var(--gemini)}.o-unassigned{--owner:var(--mute)}.pill{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11px;white-space:nowrap}.pass{color:var(--good)}.fail{color:var(--bad)}.wait{color:var(--pending)}.muted{color:var(--mute)}.recent{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.merge{padding:13px 15px}.merge b{color:var(--good)}.merge a{display:block;margin-top:4px;color:var(--chrome);text-decoration:none}.merge small{color:var(--mute)}details{background:var(--plate);border:1px solid var(--line);border-radius:8px;margin:8px 0}summary{cursor:pointer;padding:12px 15px;font-weight:650}details .past{padding:0 15px 14px;color:var(--mute)}.past ul{margin:8px 0;color:var(--chrome)}#error{display:none;color:var(--bad);padding:18px}.empty{color:var(--mute);padding:20px;text-align:center}@media(max-width:1100px){main{padding:18px}.recent{grid-template-columns:repeat(2,minmax(0,1fr))}th,td{padding:9px 8px;font-size:12px}}
</style>
</head>
<body><header><h1>Wheel of Life · Update tracker</h1><div id="refresh">Loading tracker…</div></header>
<main><div id="error"></div><section id="blocked" class="blocked"><h2>Blocked tasks</h2><div id="blocked-list"></div></section>
<section id="hero" class="hero"></section><div class="section-title"><h2>Tasks</h2><span id="task-count"></span></div><div class="table-wrap"><table><colgroup><col style="width:37%"><col style="width:14%"><col style="width:11%"><col style="width:10%"><col style="width:28%"></colgroup><thead><tr><th>Task</th><th>Owner</th><th>PR</th><th>CI</th><th>Last activity</th></tr></thead><tbody id="tasks"></tbody></table><div id="empty" class="empty" hidden>No tasks are listed for this update.</div></div>
<div class="section-title"><h2>Recent merges</h2><span>Into the current update branch</span></div><div id="merges" class="recent"></div>
<div class="section-title"><h2>Past updates</h2><span>Newest first</span></div><section id="history"></section></main>
<script>
const DATA='https://raw.githubusercontent.com/cillian1/belfast-wheel-app/tracker/tracker.json';
const HISTORY='https://raw.githubusercontent.com/cillian1/belfast-wheel-app/tracker/tracker-history.json';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ownerClass=s=>'o-'+String(s||'unassigned').toLowerCase().replace(/[^a-z]/g,'');
const time=s=>s?new Date(s).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
function render(d,h){
const u=d.update||{}, ts=d.tasks||[], p=u.progress||{}, pct=p.total?Math.round(p.done/p.total*100):0;
document.getElementById('hero').innerHTML=`<article class="card update"><h2>Update ${esc(u.number)} · ${esc(u.name)}</h2><div class="sub">Branch <span class="branch">${esc(u.branch)}</span>${u.goals?.length?' · '+u.goals.map(esc).join(' · '):''}</div>${u.cutLine?`<div class="sub" style="margin-top:8px">Cut line: ${esc(u.cutLine)}</div>`:''}</article><article class="card progress"><strong>${p.done||0} / ${p.total||0} tasks complete</strong><div class="track"><i style="width:${pct}%"></i></div><span class="sub">${pct}% progress</span></article>`;
const bs=ts.filter(t=>t.blocked);const box=document.getElementById('blocked');box.style.display=bs.length?'block':'none';document.getElementById('blocked-list').innerHTML=bs.map(t=>`<div><a href="${esc(t.url)}" target="_blank" rel="noopener">#${t.issue} ${esc(t.title)}</a> · ${esc(t.blockedText)}</div>`).join('');
document.getElementById('task-count').textContent=`${ts.length} tracked`;document.getElementById('empty').hidden=!!ts.length;
document.getElementById('tasks').innerHTML=ts.map(t=>`<tr><td class="task"><a href="${esc(t.url)}" target="_blank" rel="noopener">#${t.issue}</a> ${esc(t.title)}</td><td><span class="owner ${ownerClass(t.owner)}">${esc(t.owner)}</span></td><td>${t.pr?`<a class="pill" href="${esc(t.pr.url)}" target="_blank" rel="noopener">#${t.pr.number} · ${esc(t.pr.state)}</a>`:'<span class="muted">none</span>'}</td><td>${t.ci?`<span class="pill ${t.ci==='passing'?'pass':t.ci==='failing'?'fail':'wait'}">${esc(t.ci)}</span>`:'<span class="muted">—</span>'}</td><td>${time(t.lastActivity)}</td></tr>`).join('');
const ms=d.merges||[];document.getElementById('merges').innerHTML=ms.length?ms.map(m=>`<article class="card merge"><b>✓ #${m.number}</b><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a><small>${time(m.mergedAt)}</small></article>`).join(''):'<div class="card muted">No merges yet.</div>';
const hist=h||d.history||[];document.getElementById('history').innerHTML=hist.length?hist.map(x=>`<details><summary>Update ${esc(x.number)} · ${esc(x.name)}${x.build?` · Build ${esc(x.build)}`:''}${x.releaseDate?` · released ${time(x.releaseDate)}`:''}</summary><div class="past">${x.releasePr?`Release: <a href="${esc(x.releasePr.url)}" target="_blank" rel="noopener">PR #${x.releasePr.number}</a>`:'Release metadata pending'}<ul>${(x.tasks||[]).map(t=>`<li>${esc(t.title)} · ${esc(t.owner)} · ${t.url?`<a href="${esc(t.url)}" target="_blank" rel="noopener">PR #${t.pr}</a>`:`PR #${t.pr}`}</li>`).join('')}</ul></div></details>`).join(''):'<div class="card muted">No past updates archived yet.</div>';
document.getElementById('refresh').textContent=`Updated ${time(d.generatedAt)} · refreshes every 60 seconds`;
}
async function load(){try{const [a,b]=await Promise.all([fetch(DATA+'?t='+Date.now()),fetch(HISTORY+'?t='+Date.now())]);if(!a.ok)throw Error('Tracker data is not published yet.');const d=await a.json(),h=b.ok?await b.json():d.history;render(d,h);document.getElementById('error').style.display='none'}catch(e){document.getElementById('error').textContent=e.message;document.getElementById('error').style.display='block'}}
load();setInterval(load,60000);
</script></body></html>
