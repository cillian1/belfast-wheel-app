<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Update tracker · Wheel of Life</title>
<style>
:root{--ink:#0a0c0f;--plate:#15181c;--line:#2c333b;--chrome:#e3e8ed;--mute:#8e99a5;--gold:#f5d27a;--claude:#d97757;--copilot:#7aa7f5;--gemini:#b48cf2;--rolexg:#4fd1b5;--jimini:#f27aa8;--gambler:#e8b04a;--good:#74d39b;--bad:#ff7979;--pending:#f5d27a}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--chrome);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{position:sticky;top:0;z-index:3;background:#0a0c0fee;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}#refresh{color:var(--mute);font-size:12px}main{max-width:1500px;margin:auto;padding:24px 28px 60px}.blocked{display:none;background:#371b1b;border:1px solid #874343;border-left:4px solid var(--bad);padding:14px 18px;margin-bottom:18px;border-radius:7px}.blocked h2{font-size:15px;color:var(--bad);margin:0 0 8px}.blocked a{color:var(--chrome)}.hero{display:flex;align-items:stretch;gap:14px;margin-bottom:20px}.card{background:var(--plate);border:1px solid var(--line);border-radius:9px;padding:18px}.update{flex:1}.update h2{font-size:24px;margin:0 0 4px}.sub{color:var(--mute)}.branch{color:var(--gold);font-family:ui-monospace,monospace}.progress{width:260px;display:flex;flex-direction:column;justify-content:center}.progress strong{font-size:21px}.track{height:8px;background:#30363d;border-radius:8px;overflow:hidden;margin:10px 0 4px}.track i{height:100%;display:block;background:var(--good);width:0}.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}.section-title h2{font-size:17px;margin:0}.section-title span{font-size:12px;color:var(--mute)}.table-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--plate)}table{border-collapse:collapse;width:100%;table-layout:fixed}th{text-align:left;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.07em;background:#111418}th,td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}td a{color:var(--gold);text-decoration:none}td a:hover{text-decoration:underline}.task{font-weight:600;overflow-wrap:anywhere}.owner{font-weight:650}.owner::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--owner);margin-right:7px}.o-copilot{--owner:var(--copilot)}.o-rolexg{--owner:var(--rolexg)}.o-jimini{--owner:var(--jimini)}.o-gambler{--owner:var(--gambler)}.o-claude{--owner:var(--claude)}.o-gemini{--owner:var(--gemini)}.o-unassigned{--owner:var(--mute)}.pill{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11px;white-space:nowrap}.pass{color:var(--good)}.fail{color:var(--bad)}.wait{color:var(--pending)}.muted{color:var(--mute)}.recent{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.merge{padding:13px 15px}.merge b{color:var(--good)}.merge a{display:block;margin-top:4px;color:var(--chrome);text-decoration:none}.merge small{color:var(--mute)}details{background:var(--plate);border:1px solid var(--line);border-radius:8px;margin:8px 0}summary{cursor:pointer;padding:12px 15px;font-weight:650}details .past{padding:0 15px 14px;color:var(--mute)}.past ul{margin:8px 0;color:var(--chrome)}#error{display:none;color:var(--bad);padding:18px}.empty{color:var(--mute);padding:20px;text-align:center}@media(max-width:1100px){main{padding:18px}.recent{grid-template-columns:repeat(2,minmax(0,1fr))}th,td{padding:9px 8px;font-size:12px}}
</style>
<style>
.scopes{display:grid;gap:14px}.scope h3{margin:0 0 6px;font-size:18px}.scope p{margin:8px 0}.scope a,.deliverable a{color:var(--gold)}.scope-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.deliverable{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;overflow-wrap:anywhere}.deliverable .pill{display:inline-block;margin:3px 3px 3px 0;white-space:normal}.next{border-left:3px solid var(--gold);padding-left:10px;margin-top:8px}.warning{color:var(--bad)}.scope small{display:block;color:var(--mute)}.prior{font-size:12px;color:var(--mute)}#evidence{margin:10px 0;color:var(--bad)}.goals{padding-left:20px}.scope:target{outline:2px solid var(--gold)}
@media(max-width:600px){header{padding:12px;position:static;display:block}main{padding:12px}.hero{flex-direction:column}.progress{width:auto}.card{padding:14px}.recent{grid-template-columns:1fr}h1{font-size:18px}.pill{white-space:normal}a{overflow-wrap:anywhere}.scope p,.next{font-size:14px}}
</style>
</head>
<body><header><h1>Wheel of Life · Update tracker</h1><div id="refresh">Loading tracker…</div></header>
<main><div id="error"></div><section id="blocked" class="blocked"><h2>Blocked tasks</h2><div id="blocked-list"></div></section>
<section id="hero" class="hero"></section><div id="evidence" role="status"></div><div class="section-title"><h2>Planned changes</h2><span id="task-count"></span></div><section id="tasks" class="scopes"></section><div id="empty" class="empty" hidden>No scopes are listed for this update.</div>
<div class="section-title"><h2>Recent merges</h2><span>Into the current update branch</span></div><div id="merges" class="recent"></div>
<div class="section-title"><h2>Past updates</h2><span>Newest first</span></div><section id="history"></section></main>
<script>
const DATA='https://raw.githubusercontent.com/cillian1/belfast-wheel-app/tracker/tracker.json';
const HISTORY='https://raw.githubusercontent.com/cillian1/belfast-wheel-app/tracker/tracker-history.json';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ownerClass=s=>'o-'+String(s||'unassigned').toLowerCase().replace(/[^a-z]/g,'');
const time=s=>s?new Date(s).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const state=s=>({'working':'Working','in-progress':'In progress','partial':'Partially complete','draft-hold':'Draft / HOLD','blocked':'Blocked','awaiting-independent-review':'Awaiting independent review','awaiting-independent-merge':'Awaiting independent merge','merged-update':'Merged into update branch · not released','released':'Released on main','reverted':'Reverted · not complete','unverified-merge':'Merge ancestry unverified','closed-unmerged':'Closed without merge','wrong-target':'Wrong target branch'}[s]||s);
const issueLinks=xs=>(xs||[]).map(i=>`<a href="${esc(i.url)}" target="_blank" rel="noopener">#${esc(i.number)}</a> (${esc(i.state)})`).join(', ')||'No current issue';
const priorLinks=xs=>(xs||[]).map(r=>`<a href="https://github.com/cillian1/belfast-wheel-app/${r.issue?'issues':'pull'}/${Number(r.issue||r.pr)}">#${Number(r.issue||r.pr)}</a> — ${esc(r.reason)}`).join('; ');
function deliverableCard(x){
  const prs=(x.prs||[]).map(pr=>`<a class="pill" href="${esc(pr.url)}" target="_blank" rel="noopener">PR #${pr.number}</a>
    ${esc(state(pr.state))} · <span class="${pr.ci==='passing'?'pass':pr.ci==='failing'?'fail':'wait'}">CI ${esc(pr.ci)}</span>
    <small>Head ${esc(pr.head?.slice(0,7)||'unknown')} · GitHub author ${esc(pr.author||'unknown')}</small>`).join('<br>');
  return `<section class="deliverable"><b>${esc(x.title)}</b> · ${esc(state(x.status))}
    <small>Work owner: ${esc(x.owner)}</small>
    ${x.issues?.length?`<div>Issues: ${issueLinks(x.issues)}</div>`:''}<div>${prs||'No linked implementation PR'}</div>
    ${x.blocker?`<p class="warning">${esc(x.blocker)}</p>`:''}
    ${x.prior?.length?`<p class="prior">Prior / superseded: ${priorLinks(x.prior)}</p>`:''}
    ${x.reverts?.length?`<p class="prior">${x.reverts.map(r=>`Revert <a href="https://github.com/cillian1/belfast-wheel-app/pull/${Number(r.pr)}">#${Number(r.pr)}</a> of #${Number(r.reverts)} · ${r.verified?'verified in update branch':'not verified in update branch'}`).join('; ')}</p>`:''}
    <div class="next"><b>Next: ${esc(x.next.owner)}</b> — ${esc(x.next.action)}</div></section>`;
}
function scopeCard(t,ts){
  return `<article class="card scope" id="scope-${esc(t.id)}"><div class="scope-head"><h3>${esc(t.title)}</h3>
    <span class="pill">${esc(state(t.status))} · ${t.progress.done}/${t.progress.total}</span></div>
    <small>Scope: ${esc(t.id)}</small><p>${esc(t.description)}</p><div>Current issues: ${issueLinks(t.issues)}</div>
    <p>Work owner: <span class="owner ${ownerClass(t.owner)}">${esc(t.owner)}</span>${t.implementationAuthor?` · Original author: ${esc(t.implementationAuthor)}`:''}</p>
    ${t.prior?.length?`<p class="prior">Prior / superseded: ${priorLinks(t.prior)}</p>`:''}
    ${t.dependencies?.length?`<p>Dependencies: ${t.dependencies.map(id=>`<a href="#scope-${esc(id)}">${esc(ts.find(s=>s.id===id)?.title||id)}</a>`).join(', ')}</p>`:''}
    ${(t.deliverables||[]).map(deliverableCard).join('')}<small>Last activity ${time(t.lastActivity)}</small></article>`;
}
function render(d,h){
const u=d.update||{}, ts=d.scopes||[], p=u.progress||{}, pct=p.total?Math.round(p.done/p.total*100):0;
document.getElementById('hero').innerHTML=`<article class="card update"><h2>${esc(u.name||'Update '+u.number)}</h2><div class="sub">Branch <span class="branch">${esc(u.branch)}</span></div><details><summary>Approved goals and cut line</summary><ul class="goals">${(u.goals||[]).map(g=>`<li>${esc(g)}</li>`).join('')}</ul><p>${esc(u.cutLine)}</p></details></article><article class="card progress"><strong>${p.done||0} / ${p.total||0} scopes in update branch</strong><div class="track"><i style="width:${pct}%"></i></div><span class="sub">Merged is not released. Green CI is not merged.</span></article>`;
const bs=ts.filter(t=>t.blocked);const box=document.getElementById('blocked');box.style.display=bs.length?'block':'none';document.getElementById('blocked-list').innerHTML=bs.map(t=>`<div><a href="#scope-${esc(t.id)}">${esc(t.title)}</a> · ${esc((t.deliverables||[]).filter(x=>x.blocker).map(x=>x.blocker).join('; '))}</div>`).join('');
document.getElementById('evidence').textContent=(d.warnings||[]).length?'Incomplete live evidence: '+d.warnings.join(' · '):!d.scopes?'Published data still uses the old issue-only format. Scope-aware refresh has not been published yet.':'';
document.getElementById('task-count').textContent=`${ts.length} stable scopes`;document.getElementById('empty').hidden=!!ts.length;
document.getElementById('tasks').innerHTML=ts.map(t=>scopeCard(t,ts)).join('');
const ms=d.merges||[];document.getElementById('merges').innerHTML=ms.length?ms.map(m=>`<article class="card merge"><b>✓ #${m.number}</b><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a><small>${time(m.mergedAt)}</small></article>`).join(''):'<div class="card muted">No merges yet.</div>';
const hist=h||d.history||[];document.getElementById('history').innerHTML=hist.length?hist.map(x=>`<details><summary>Update ${esc(x.number)} · ${esc(x.name)}${x.build?` · Build ${esc(x.build)}`:''}${x.releaseDate?` · recorded ${time(x.releaseDate)}`:''}</summary><div class="past">${x.releasePr?`Historical release record (not live-verified): <a href="${esc(x.releasePr.url)}" target="_blank" rel="noopener">PR #${x.releasePr.number}</a>`:'Release metadata pending'}${(x.scopes||[]).map(t=>t.deliverables?scopeCard(t,x.scopes):'').join('')}<ul>${(x.tasks||[]).map(t=>`<li>${esc(t.title)} · ${esc(t.owner)} · ${t.url?`<a href="${esc(t.url)}" target="_blank" rel="noopener">PR #${t.pr}</a>`:`PR #${t.pr}`}</li>`).join('')}</ul></div></details>`).join(''):'<div class="card muted">No past updates archived yet.</div>';
document.getElementById('refresh').textContent=`Updated ${time(d.generatedAt)} · refreshes every 60 seconds`;
}
async function load(){try{const [a,b]=await Promise.all([fetch(DATA+'?t='+Date.now()),fetch(HISTORY+'?t='+Date.now())]);if(!a.ok)throw Error('Tracker data is not published yet.');const d=await a.json(),h=b.ok?await b.json():d.history;render(d,h);document.getElementById('error').style.display='none'}catch(e){document.getElementById('error').textContent=e.message;document.getElementById('error').style.display='block'}}
load();setInterval(load,60000);
</script></body></html>
